global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: project-54-master
    role: federation-master

scrape_configs:
  - job_name: federation-us-east
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /federate
    honor_labels: true
    params:
      match[]:
        - '{job="prometheus"}'
    static_configs:
      - targets:
          - prometheus-us-east:9090
        labels:
          source_region: us-east

  - job_name: federation-eu-west
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /federate
    honor_labels: true
    params:
      match[]:
        - '{job="prometheus"}'
    static_configs:
      - targets:
          - prometheus-eu-west:9090
        labels:
          source_region: eu-west

  - job_name: federation-ap-south
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /federate
    honor_labels: true
    params:
      match[]:
        - '{job="prometheus"}'
    static_configs:
      - targets:
          - prometheus-ap-south:9090
        labels:
          source_region: ap-south
